name: bootstrap profile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install fonttools brotli pillow numpy
      - name: fonts, headings, placeholder portrait
        run: |
          python3 scripts/build_fonts.py
          cd scripts
          python3 build_static.py
          python3 portrait.py --placeholder xreep
      - name: stats and project list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py
      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets fonts README.md
          git diff --cached --quiet && exit 0
          git commit -m "profile: bootstrap assets"
          git push
