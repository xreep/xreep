name: refresh profile
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:          # deliberately no `push`: this job commits, a push trigger would loop
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 scripts/generate_stats.py
      - name: commit if changed
        run: |
          [ -z "$(git status --porcelain -- README.md)" ] && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "profile: refresh"
          git pull --rebase -q
          git push
